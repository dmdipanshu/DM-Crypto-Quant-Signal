[project]
name = "dm-crypto-quant-signal"
version = "0.1.0"
description = "SignalForge — standalone crypto quant signal engine (Phase 1 foundation)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "DM Crypto Quant" }]
keywords = ["crypto", "quant", "signals", "research"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=14.0",
  "ccxt>=4.0",
  "typer>=0.9",
  "rich>=13.0",
  "tenacity>=8.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "tomli>=2.0; python_version < '3.11'",
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.optional-dependencies]
# NOT required for Phase 1. Placeholders for later phases — do not install yet.
ml = ["lightgbm>=4.0", "optuna>=3.0"]
api = ["fastapi>=0.104", "uvicorn>=0.24"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = ["dm-crypto-quant-signal[ml,api,dev]"]

[project.scripts]
sf = "crypto_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.coverage.run]
source = ["crypto_engine"]
branch = true

[tool.coverage.report]
show_missing = true
