# SignalForge default configuration (Phase 1).
# Non-secret settings only. Secrets (API keys) live in environment / .env, NEVER here.

[exchange]
name = "binance"        # ccxt exchange id for public market data
timeout_ms = 10000      # per-request timeout
max_retries = 3         # bounded retries with backoff (see tenacity policy in engine)
rate_limit = true       # honor ccxt rate limiting

[data]
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
timeframes = ["1h", "4h"]
storage_path = "data"   # relative to repo root; raw/ and processed/ subdirs
format = "parquet"      # canonical on-disk format (pyarrow)

[logging]
level = "INFO"          # DEBUG | INFO | WARNING | ERROR

# Phase 2 model training bounds (4 GB laptop: single process, bounded rows).
[model]
default_family = "logistic"  # logistic | trend | majority (lightgbm optional)
random_state = 42            # fixed seed for deterministic training
max_rows_train = 2000        # explicit sample cap; log whenever applied, never silently drop
chunk_rows = 5000            # row-chunk bound for feature/label prep before training
n_jobs = 1                   # always 1 on 4GB laptop; do not raise

# Local model registry (atomic writes, no overwrite, checksum-verified).
[registry]
path = "models/artifacts"  # relative to repo root; git-ignored
allow_overwrite = false    # never overwrite an existing model_id dir

# Phase 3 probability calibration (Track A). 4GB: calibration splits are
# small (default floor 20 rows); isotonic needs materially more samples
# than sigmoid to avoid overfitting the calibration split.
[calibration]
method = "sigmoid"      # sigmoid (Platt) | isotonic
min_cal_samples = 20    # floor on chronologically-later calibration rows
# positive_class = <int>  # unset: defaults to base model classes[1]

# Phase 3 walk-forward / holdout / cost validation (Track B engine).
# 4GB: keep windows small, n_jobs = 1, bounded bootstraps.
[validation]
n_folds = 3             # 1..10 purged walk-forward folds
train_window = 200      # bars per training window
val_window = 50         # bars per validation window
embargo_bars = 24       # gap between train end and val start
purge_overlaps = true   # drop overlapping train/val rows
holdout_frac = 0.15     # 0..0.4 locked final-holdout fraction
min_fold_samples = 30   # floor on rows per fold
max_bootstrap = 200     # 1..1000 bounded bootstrap draws
block_bootstrap_len = 20  # block length for time-series bootstrap
fee_bp = 10.0           # explicit cost model (basis points)
slippage_bp = 5.0       # explicit cost model (basis points)
random_state = 42       # fixed seed for deterministic validation

# Phase 4 AI provider interface (Track A). All providers DISABLED by default;
# secrets live in env/.env only, never here. Adapters use stdlib urllib;
# provider SDKs are bring-your-own (pip install openai/anthropic/etc.) —
# there are no registry-based ai-* extras (no package network in this env).
[ai]
enabled = false            # global AI switch; deterministic core runs alone
default_provider = "none"  # reserved (legacy); routing is [ai.tasks.*] only
fallback_order = []        # reserved (legacy); no runtime failover is implemented
cache_ttl_s = 0            # reserved; no response cache exists
log_prompts = false        # reserved; no prompt/response logging exists
timeout_s = 30.0           # bounded per-request ceiling (seconds)
max_retries = 2            # bounded retries (0..3)
max_request_chars = 8000   # bounded request size
max_response_chars = 4000  # bounded response size
max_output_tokens = 1024   # bounded output ceiling
max_concurrent_requests = 1  # single-process design: exactly one in flight

[ai.budgets]
# Parsed and validated, but no budget tracker is wired yet. The [ai] limits
# above are the enforced bounds.
max_requests = 10          # reserved; not enforced
max_chars = 200000         # reserved; not enforced

